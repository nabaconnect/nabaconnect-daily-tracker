
name: Build NabaConnect Tracker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          unzip -o NabaConnectDailyTracker-Android-Phone-Build.zip -d .

      
      - name: Align Java and Kotlin JVM targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("NabaConnectDailyTracker-Android/app/build.gradle")
          s = p.read_text()

          block = """
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          """

          if "jvmTarget = '17'" not in s:
              s = s.replace("android {", "android {" + block, 1)
              p.write_text(s)

          print(p.read_text())
          PY

    
         


      - name: Build APK
        run: gradle --no-daemon -p NabaConnectDailyTracker-Android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NabaConnect-Daily-Tracker-APK
          path: NabaConnectDailyTracker-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
