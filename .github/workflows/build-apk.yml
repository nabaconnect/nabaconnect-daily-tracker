
name: Build NabaConnect Tracker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          unzip -o NabaConnectDailyTracker-Android-Phone-Build.zip -d .

      - name: Align Java target
        run: |
          sed -i 's/VERSION_1_8/VERSION_17/g' NabaConnectDailyTracker-Android/app/build.gradle


      - name: Build APK
        run: gradle --no-daemon -p NabaConnectDailyTracker-Android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NabaConnect-Daily-Tracker-APK
          path: NabaConnectDailyTracker-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
